name: Build V3.1 Closed Test AAB

on:
  push:
    branches: [v3.1-player-feedback-fixes]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify V3.1 closed-test configuration
        run: |
          grep -q 'versionCode 4' android/app/build.gradle
          grep -q 'versionName "3.1.0"' android/app/build.gradle
          grep -q 'ca-app-pub-3940256099942544/5224354917' src/engine/ads.ts
          grep -q 'const IS_TESTING = true' src/engine/ads.ts
          grep -q 'ca-app-pub-3940256099942544~3347511713' android/app/src/main/AndroidManifest.xml
          if grep -R -q 'ca-app-pub-5886721718793058' src android/app/src/main/AndroidManifest.xml; then
            echo 'ERROR: production AdMob ID found in closed-test build.'
            exit 1
          fi
          echo 'V3.1 version and Google test ads verified.'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Re-verify test ads after Capacitor sync
        run: |
          grep -q 'ca-app-pub-3940256099942544~3347511713' android/app/src/main/AndroidManifest.xml
          if grep -R -q 'ca-app-pub-5886721718793058' dist android/app/src/main/AndroidManifest.xml; then
            echo 'ERROR: production AdMob ID leaked into compiled closed-test assets.'
            exit 1
          fi

      - name: Decode release keystore
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'ERROR: signing keystore secret missing'; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d --ignore-garbage > android/app/kickoff-star-release.keystore
          SIZE=$(stat -c%s android/app/kickoff-star-release.keystore)
          echo "Decoded keystore size: $SIZE bytes"
          test "$SIZE" -ge 500 || { echo 'ERROR: decoded keystore is suspiciously small'; exit 1; }

      - name: Build signed V3.1 release AAB
        working-directory: android
        env:
          KEYSTORE_PATH: kickoff-star-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Upload V3.1 closed-test AAB
        uses: actions/upload-artifact@v4
        with:
          name: kickoff-star-v3.1-closed-test-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
