name: Build Kickoff Star V3 AAB

on:
  push:
    branches: [main, v3-release-build]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Decode existing Play signing keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: echo "$KEYSTORE_BASE64" | base64 -d --ignore-garbage > android/app/kickoff-star-release.keystore

      - name: Verify decoded keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          SIZE=$(stat -c%s android/app/kickoff-star-release.keystore)
          echo "Decoded keystore size: $SIZE bytes"
          if [ "$SIZE" -lt 500 ]; then
            echo "ERROR: decoded keystore is suspiciously small. Check KEYSTORE_BASE64."
            exit 1
          fi

      - name: Build signed release AAB
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        working-directory: android
        env:
          KEYSTORE_PATH: kickoff-star-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Build unsigned release AAB when signing secrets are unavailable
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: kickoff-star-v3-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
