name: V4 Youth World Validation
# Layers 1-7 integrated validation

on:
  push:
    branches: [v4-youth-world]
    paths:
      - 'src/types/youthWorld.ts'
      - 'src/engine/youthWorld.ts'
      - 'src/engine/youthPathways.ts'
      - 'src/engine/youthSchedule.ts'
      - 'src/engine/youthScoutingV4.ts'
      - 'src/engine/youthCompetitionsV4.ts'
      - 'src/engine/youthFinancesV4.ts'
      - 'src/engine/youthAcademyV4.ts'
      - 'src/engine/academyCareerV4.ts'
      - 'src/engine/save.ts'
      - 'src/store/careerStore.ts'
      - 'scripts/auditYouthWorldV4.ts'
      - 'scripts/auditYouthLayers34V4.ts'
      - 'scripts/auditYouthLayers56V4.ts'
      - 'scripts/auditYouthAcademyV4.ts'
      - '.github/workflows/v4-youth-world.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Youth world audit
        run: npx tsx scripts/auditYouthWorldV4.ts
      - name: Scheduling and scouting audit
        run: npx tsx scripts/auditYouthLayers34V4.ts
      - name: Competition and finance audit
        run: npx tsx scripts/auditYouthLayers56V4.ts
      - name: Academy trials and offers audit
        run: npx tsx scripts/auditYouthAcademyV4.ts
      - name: Production build
        run: npm run build
