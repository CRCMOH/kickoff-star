name: V3.2 Android Build

on:
  workflow_dispatch:
  push:
    branches: [v3.2-match-engine-redesign]
    paths:
      - 'src/**'
      - 'android/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - '.github/workflows/v32-android-build.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Web production build
        run: npm run build
      - name: Sync Android
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kickoff-star-v32-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
