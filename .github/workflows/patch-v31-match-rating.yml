name: Patch V3.1 match rating

on:
  push:
    branches: [v3.1-player-feedback-fixes]
    paths:
      - '.github/workflows/patch-v31-match-rating.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3.1-player-feedback-fixes

      - name: Patch match decision quality wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/screens/MatchScreen.tsx')
          text = p.read_text()
          old = """    const bestOptionChance = Math.max(...bundle.decision.options.map((o) => o.successChance))
              const quality = bestOptionChance > 0 ? option.successChance / bestOptionChance : 0.5

              const archBonus = archetypeMomentBonus(player.archetype, !moment.isDefensive, moment.isDefensive, option.successChance < 0.5)
              const finalChance = Math.min(0.97, adjustChance(option.successChance, grade) + archBonus)
              const success = rand() < finalChance

              const next = moment.scenarioId
                ? resolveScenarioBeat(state, moment, optIndex, quality, success, chosenReward, bundle.maxReward, grade)
                : resolvePlayerMoment(state, moment, quality, success, chosenReward, bundle.maxReward, player.position === 'GK', grade)
          """
          # Current file indentation is 4 spaces, not the 14-space formatting above.
          old2 = """    const bestOptionChance = Math.max(...bundle.decision.options.map((o) => o.successChance))
              const quality = bestOptionChance > 0 ? option.successChance / bestOptionChance : 0.5
          """
          # Use targeted replacements so formatting differences cannot make the patch brittle.
          if 'const quality = bestOptionChance > 0 ? option.successChance / bestOptionChance : 0.5' not in text:
              raise SystemExit('Expected decision-quality line not found; refusing unsafe patch')
          text = text.replace(
              'const quality = bestOptionChance > 0 ? option.successChance / bestOptionChance : 0.5',
              "const decisionQuality = bestOptionChance > 0 ? option.successChance / bestOptionChance : 0.5\n    const outcomeQuality = bundle.maxReward > 0 ? chosenReward / bundle.maxReward : 0.5"
          )
          text = text.replace(
              'resolveScenarioBeat(state, moment, optIndex, quality, success, chosenReward, bundle.maxReward, grade)',
              'resolveScenarioBeat(state, moment, optIndex, outcomeQuality, success, decisionQuality, 1, grade)'
          )
          text = text.replace(
              "resolvePlayerMoment(state, moment, quality, success, chosenReward, bundle.maxReward, player.position === 'GK', grade)",
              "resolvePlayerMoment(state, moment, outcomeQuality, success, decisionQuality, 1, player.position === 'GK', grade)"
          )
          p.write_text(text)
          PY

      - name: Remove one-shot patch workflow
        run: git rm .github/workflows/patch-v31-match-rating.yml

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/MatchScreen.tsx
          git commit -m "Fix match rating to reward sensible decisions [skip ci]"
          git push origin HEAD:v3.1-player-feedback-fixes
